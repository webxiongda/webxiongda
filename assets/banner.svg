      <stop offset="0%" stop-color="#080512"/>
      <stop offset="100%" stop-color="#160a24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2a9d"/>
      <stop offset="100%" stop-color="#00f0ff"/>
