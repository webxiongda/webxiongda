    <text x="60" y="124" fill="#f0f6fc" font-size="52" font-weight="700" letter-spacing="1">POLARBEAR</text>
    <text x="64" y="166" fill="#c9d1d9" font-size="22" letter-spacing="2">Full-stack Engineer · 8+ Years of Experience</text>
    <text x="64" y="204" fill="#00f0ff" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Java / Backend / Node.js / Go / React / TypeScript</text>
